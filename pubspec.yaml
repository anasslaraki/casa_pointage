name: casa_pointage
description: "Casa Pointage - staff attendance app."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  intl: any
  auto_size_text: ^3.0.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.6
  dio: ^5.0.1
  equatable: ^3.0.0
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.0.17
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  injectable: ^3.0.0
  logger: ^2.5.0
  permission_handler: ^12.0.1
  uuid: ^4.5.1
  google_fonts: ^8.1.0
  flutter_screenutil: ^5.9.3
  camera: ^0.12.0+1
  image_picker: ^1.2.2
  geolocator: ^14.0.1
  google_mlkit_face_detection: ^0.14.0
  onnxruntime: ^1.4.1
  image: ^4.12.0
  location: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.2.5
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/models/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
        - asset: assets/fonts/Barlow-ExtraBold.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
